<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Codium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>

<body>
  <div id="app">
    <div class="sidebar left">EXPLORER</div>

    <div class="resizer vertical"></div>

    <div class="center">
      <div class="editor">EDITOR</div>

      <div class="resizer horizontal"></div>

      <div class="terminal">
        <div id="terminal-container"></div>
      </div>
    </div>

    <div class="resizer vertical"></div>

    <div class="sidebar right">AI HELPER</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js" defer></script>
  <script src="script.js" defer></script>
  <script src="terminal.js" defer></script>
</body>

</html>
