<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Codium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>

<body>
  <div id="app">
    <!-- Left Sidebar - File Explorer -->
    <div class="sidebar left">
      <div class="explorer-header">
        <span id="folder-name">NO FOLDER</span>
        <div class="explorer-actions">
          <button id="open-folder-btn" class="icon-btn" title="Open Folder">📂</button>
          <button id="new-file-btn" class="icon-btn" title="New File">➕</button>
          <button id="refresh-btn" class="icon-btn" title="Refresh">🔄</button>
        </div>
      </div>
      <div id="file-tree" class="empty-state">
        <div class="empty-message">
          <div class="empty-icon">📁</div>
          <p>You have not yet opened a folder</p>
          <button id="open-folder-empty" class="open-btn">Open Folder</button>
        </div>
      </div>
    </div>

    <div class="resizer vertical"></div>

    <!-- Center - Editor + Terminal -->
    <div class="center">
      <!-- Editor Area -->
      <div class="editor">
        <!-- Editor Controls Bar -->
        <div class="editor-controls">
          <div id="tabs-container" class="tabs-container"></div>
          <div class="editor-settings">
            <select id="theme-select" class="settings-dropdown" title="Theme">
              <option value="vs-dark">Dark</option>
              <option value="vs-light">Light</option>
              <option value="hc-black">High Contrast</option>
              <option value="codium-dark">Codium Dark</option>
            </select>
            <select id="font-select" class="settings-dropdown" title="Font">
              <option value="Fira Code">Fira Code</option>
              <option value="Consolas">Consolas</option>
              <option value="Monaco">Monaco</option>
              <option value="Courier New">Courier New</option>
              <option value="JetBrains Mono">JetBrains Mono</option>
              <option value="Source Code Pro">Source Code Pro</option>
            </select>
            <button id="font-decrease" class="icon-btn-small" title="Decrease Font Size">A-</button>
            <span id="font-size-display" class="font-size-label">14</span>
            <button id="font-increase" class="icon-btn-small" title="Increase Font Size">A+</button>
          </div>
        </div>
        <div id="monaco-editor" class="monaco-container"></div>
      </div>

      <div class="resizer horizontal"></div>

      <!-- Terminal Area -->
      <div class="terminal">
        <div id="terminal-container"></div>
      </div>
    </div>

    <div class="resizer vertical"></div>

    <!-- Right Sidebar -->
    <div class="sidebar right">
      <div style="padding: 12px; color: #888;">AI HELPER</div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu">
    <div class="context-item" data-action="new-file">New File</div>
    <div class="context-item" data-action="rename">Rename</div>
    <div class="context-item" data-action="delete">Delete</div>
  </div>

  <!-- Load Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  
  <!-- Monaco Editor -->
  <script>
    var require = { paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.nls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.js"></script>

  <!-- App Scripts -->
  <script src="script.js"></script>
  <script src="app.js"></script>
  <script src="terminal.js"></script>
</body>

</html>
